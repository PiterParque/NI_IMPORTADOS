{% extends "./perfil.html" %}

{% block conteudo %}
{% if messages %}
    {% for message in messages %}
        <div class="alert {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
<h1>Dados Pessoais</h1>

<form class="form-perfil" method="POST">
    {% csrf_token %}

    <label>Nome</label>
    <input type="text" name="nome" id="nome" value="{{ cliente.nome }}">

    <label>Email</label>
    <input type="email" name="email" value="{{ cliente.email }}" readonly>

    <label>CPF</label>
    <input type="text" name="CPF" value="{{ cliente.CPF }}">

    <label>Gênero</label>
    <select name="genero">
        <option value="">Selecione</option>
        <option value="M" {% if cliente.genero == "M" %}selected{% endif %}>Masculino</option>
        <option value="F" {% if cliente.genero == "F" %}selected{% endif %}>Feminino</option>
        <option value="O" {% if cliente.genero == "O" %}selected{% endif %}>Outro</option>
    </select>

    <label>Data de Nascimento</label>
    <input type="date" name="data_nascimento" value="{{ cliente.data_nascimento|date:'Y-m-d' }}">
 
    <button class="btn" type="submit">Salvar</button>
</form>

{% endblock %}
