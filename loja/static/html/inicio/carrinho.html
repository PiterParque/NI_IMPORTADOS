{% load static %}
<!-- OVERLAY -->
<div id="overlay-carrinho" class="carrinho-overlay"></div>

<!-- CARRINHO LATERAL -->
<aside id="carrinho-lateral" class="carrinho-lateral">

  <!-- HEADER -->
  <div class="carrinho-header">
    <h2>Meu Carrinho</h2>
    <button type="button" id="fechar-carrinho" class="fechar-carrinho" name="fechar-carrinho" aria-label="Fechar carrinho">
      ✕
    </button>
  </div>

  <!-- ITENS (JS PREENCHE AQUI) -->
  <div class="carrinho-itens" id="carrinho-itens">
    <!-- Produtos inseridos dinamicamente -->
  </div>

  <!-- FOOTER -->
  <div class="carrinho-footer">
    <p class="carrinho-total">
      Total: <strong id="carrinho-total">R$ 0,00</strong>
    </p>

    <a href="" class="btn-finalizar">
      Finalizar compra
    </a>
  </div>

</aside>
