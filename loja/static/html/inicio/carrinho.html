{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="stylesheet" href="{% static 'css/carrinho.css' %}">
</head>
<body>

<div class="carrinho-container">

    <h1>Meu Carrinho</h1>

    <!-- ITEM -->
    <div class="carrinho-item">
        <img src="{% static 'imagens/perfumes_1.jpg' %}" alt="Produto">

        <div class="item-info">
            <h3>Perfume Importado X</h3>
            <p>Quantidade: 1</p>
        </div>

        <div class="item-preco">
            <p>R$ 299,90</p>
            <button class="remover">Remover</button>
        </div>
    </div>

    <!-- ITEM -->
    <div class="carrinho-item">
        <img src="{% static 'imagens/perfumes_2.jpg' %}" alt="Produto">

        <div class="item-info">
            <h3>Perfume Importado Y</h3>
            <p>Quantidade: 2</p>
        </div>

        <div class="item-preco">
            <p>R$ 499,90</p>
            <button class="remover">Remover</button>
        </div>
    </div>

    <!-- RESUMO -->
    <div class="resumo">
        <p>Total: <strong>R$ 799,80</strong></p>
        <button class="finalizar">Finalizar Compra</button>
    </div>

</div>

</body>
</html>
