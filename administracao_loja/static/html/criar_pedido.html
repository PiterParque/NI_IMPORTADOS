{% extends "./index.html" %}
{% load static %}
{% block main %}
<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    {{ formset.management_form }}

    <h3>Itens</h3>

    {% for f in formset %}
        <div>
            {{ f.perfume }}
            {{ f.quantidade }}
            {{ f.preco_unitario }}
            {{ f.DELETE }}
        </div>
    {% endfor %}

    <button type="submit">Salvar</button>
</form>

{% endblock main%}
